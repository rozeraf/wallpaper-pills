<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Генератор минималистичных обоев из «таблеток» — оттенки, градиенты, PNG и SVG прямо в браузере.">
<title>Pills — генератор обоев</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23131317'/%3E%3Cg stroke='%23131317' stroke-width='1.5'%3E%3Crect x='3.5' y='6' width='11' height='20' rx='5.5' fill='%23e6d8ff'/%3E%3Crect x='10.5' y='6' width='11' height='20' rx='5.5' fill='%239965f0'/%3E%3Crect x='17.5' y='6' width='11' height='20' rx='5.5' fill='%233b1773'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside>
  <header class="brand">
    <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
    <div><h1>Pills</h1><p>генератор обоев</p></div>
  </header>

  <fieldset>
    <legend>Разрешение</legend>
    <div class="row">
      <select id="preset" aria-label="Пресет разрешения">
        <option value="1920x1080">1920×1080</option>
        <option value="2560x1440">2560×1440</option>
        <option value="3840x2160">3840×2160</option>
        <option value="3440x1440">3440×1440</option>
        <option value="2560x1600">2560×1600</option>
        <option value="1080x2400">1080×2400 (телефон)</option>
        <option value="1179x2556">1179×2556 (iPhone)</option>
        <option value="custom">своё…</option>
      </select>
      <input type="number" id="w" min="100" max="10000" aria-label="Ширина"><span class="x">×</span>
      <input type="number" id="h" min="100" max="10000" aria-label="Высота">
    </div>
  </fieldset>

  <fieldset>
    <legend>Цвета</legend>
    <div class="seg seg-wide" role="radiogroup" aria-label="Режим цвета">
      <input type="radio" name="mode" id="m-auto" value="auto"><label for="m-auto">Авто</label>
      <input type="radio" name="mode" id="m-grad" value="gradient"><label for="m-grad">Градиент</label>
      <input type="radio" name="mode" id="m-raw" value="raw"><label for="m-raw">Как есть</label>
    </div>
    <div class="colors" id="colors"></div>
    <p class="hint" id="modeHint"></p>
    <label class="field">Фон <input type="color" id="bg"></label>
    <label class="field">Развернуть порядок <input type="checkbox" id="reverse" class="switch" role="switch"></label>
    <div id="lightDark">
      <label class="field slider"><span class="name">Светлый край</span><input type="range" id="light" min="0.5" max="1" step="0.01"><span class="v" id="lightV"></span></label>
      <label class="field slider"><span class="name">Тёмный край</span><input type="range" id="dark" min="0" max="0.5" step="0.01"><span class="v" id="darkV"></span></label>
    </div>
    <button class="btn btn-block" id="random"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" class="dot"/><circle cx="15.5" cy="15.5" r="1.3" class="dot"/><circle cx="12" cy="12" r="1.3" class="dot"/></svg>Случайные цвета<kbd>R</kbd></button>
  </fieldset>

  <fieldset>
    <legend>Элементы</legend>
    <label class="field slider"><span class="name">Кол-во</span><input type="range" id="count" min="1" max="30" step="1"><span class="v" id="countV"></span></label>
    <label class="field slider"><span class="name">Ширина ряда</span><input type="range" id="fit" min="0.1" max="1" step="0.01"><span class="v" id="fitV"></span></label>
    <label class="field slider"><span class="name">Высота</span><input type="range" id="height" min="0.05" max="1" step="0.01"><span class="v" id="heightV"></span></label>
    <label class="field slider"><span class="name">Расстояние</span><input type="range" id="gap" min="-0.9" max="1" step="0.01"><span class="v" id="gapV"></span></label>
    <p class="hint">Расстояние в долях ширины элемента; меньше нуля — нахлёст.</p>
    <label class="field slider"><span class="name">Скругление</span><input type="range" id="radius" min="0" max="1" step="0.01"><span class="v" id="radiusV"></span></label>
    <label class="field slider"><span class="name">Поворот</span><input type="range" id="angle" min="-90" max="90" step="1"><span class="v" id="angleV"></span></label>
    <label class="field slider"><span class="name">Тень</span><input type="range" id="shadow" min="0" max="1" step="0.01"><span class="v" id="shadowV"></span></label>
    <div class="field">Сверху
      <div class="seg" role="radiogroup" aria-label="Какие элементы сверху">
        <input type="radio" name="stack" id="s-l" value="left"><label for="s-l">левые</label>
        <input type="radio" name="stack" id="s-r" value="right"><label for="s-r">правые</label>
      </div>
    </div>
  </fieldset>

  <div class="footer">
    <button class="btn btn-ghost" id="reset">Сбросить настройки</button>
  </div>
</aside>

<main>
  <div class="stage"><div id="preview" role="img" aria-label="Предпросмотр обоев"></div></div>
  <div id="palette"></div>
  <div class="actions">
    <button class="btn primary" id="dlPng"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg><span>Скачать PNG</span></button>
    <button class="btn" id="dlSvg"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg><span>SVG</span></button>
    <button class="btn" id="share"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg><span>Ссылка</span></button>
  </div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
