<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Генератор минималистичных обоев из «таблеток» — оттенки, градиенты, PNG и SVG прямо в браузере.">
<title>Pills — генератор обоев</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23131317'/%3E%3Cg stroke='%23131317' stroke-width='1.5'%3E%3Crect x='3.5' y='6' width='11' height='20' rx='5.5' fill='%23e6d8ff'/%3E%3Crect x='10.5' y='6' width='11' height='20' rx='5.5' fill='%239965f0'/%3E%3Crect x='17.5' y='6' width='11' height='20' rx='5.5' fill='%233b1773'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside>
  <header class="brand">
    <span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>
    <div><h1>Pills</h1><p data-i18n="tagline">генератор обоев</p></div>
    <div class="lang" role="group" aria-label="Язык" data-i18n-aria="language">
      <button data-lang="ru">RU</button><button data-lang="en">EN</button>
    </div>
  </header>

  <fieldset>
    <legend data-i18n="resolution">Разрешение</legend>
    <div class="row">
      <select id="preset" aria-label="Пресет разрешения" data-i18n-aria="resPreset">
        <option value="1920x1080">1920×1080</option>
        <option value="2560x1440">2560×1440</option>
        <option value="3840x2160">3840×2160</option>
        <option value="3440x1440">3440×1440</option>
        <option value="2560x1600">2560×1600</option>
        <option value="1080x2400" data-i18n-suffix="phone">1080×2400 (телефон)</option>
        <option value="1179x2556">1179×2556 (iPhone)</option>
        <option value="custom" data-i18n="custom">своё…</option>
      </select>
      <input type="number" id="w" min="100" max="10000" aria-label="Ширина" data-i18n-aria="width"><span class="x">×</span>
      <input type="number" id="h" min="100" max="10000" aria-label="Высота" data-i18n-aria="height">
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="colors">Цвета</legend>
    <div class="seg seg-wide" role="radiogroup" aria-label="Режим цвета" data-i18n-aria="colorMode">
      <input type="radio" name="mode" id="m-auto" value="auto"><label for="m-auto" data-i18n="auto">Авто</label>
      <input type="radio" name="mode" id="m-grad" value="gradient"><label for="m-grad" data-i18n="gradient">Градиент</label>
      <input type="radio" name="mode" id="m-raw" value="raw"><label for="m-raw" data-i18n="raw">Как есть</label>
    </div>
    <div class="colors" id="colors"></div>
    <p class="hint" id="modeHint"></p>
    <label class="field"><span data-i18n="bg">Фон</span> <input type="color" id="bg"></label>
    <label class="field"><span data-i18n="reverse">Развернуть порядок</span> <input type="checkbox" id="reverse" class="switch" role="switch"></label>
    <div id="lightDark">
      <label class="field slider"><span class="name" data-i18n="light">Светлый край</span><input type="range" id="light" min="0.5" max="1" step="0.01"><span class="v" id="lightV"></span></label>
      <label class="field slider"><span class="name" data-i18n="dark">Тёмный край</span><input type="range" id="dark" min="0" max="0.5" step="0.01"><span class="v" id="darkV"></span></label>
    </div>
    <button class="btn btn-block" id="random"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.3" class="dot"/><circle cx="15.5" cy="15.5" r="1.3" class="dot"/><circle cx="12" cy="12" r="1.3" class="dot"/></svg><span data-i18n="random">Случайные цвета</span><kbd>R</kbd></button>
  </fieldset>

  <fieldset>
    <legend data-i18n="elements">Элементы</legend>
    <label class="field slider"><span class="name" data-i18n="count">Кол-во</span><input type="range" id="count" min="1" max="30" step="1"><span class="v" id="countV"></span></label>
    <label class="field slider"><span class="name" data-i18n="fit">Ширина ряда</span><input type="range" id="fit" min="0.1" max="1" step="0.01"><span class="v" id="fitV"></span></label>
    <label class="field slider"><span class="name" data-i18n="height">Высота</span><input type="range" id="height" min="0.05" max="1" step="0.01"><span class="v" id="heightV"></span></label>
    <label class="field slider"><span class="name" data-i18n="gap">Расстояние</span><input type="range" id="gap" min="-0.9" max="1" step="0.01"><span class="v" id="gapV"></span></label>
    <p class="hint" data-i18n="gapHint">Расстояние в долях ширины элемента; меньше нуля — нахлёст.</p>
    <label class="field slider"><span class="name" data-i18n="radius">Скругление</span><input type="range" id="radius" min="0" max="1" step="0.01"><span class="v" id="radiusV"></span></label>
    <label class="field slider"><span class="name" data-i18n="angle">Поворот</span><input type="range" id="angle" min="-90" max="90" step="1"><span class="v" id="angleV"></span></label>
    <label class="field slider"><span class="name" data-i18n="shadow">Тень</span><input type="range" id="shadow" min="0" max="1" step="0.01"><span class="v" id="shadowV"></span></label>
    <div class="field"><span data-i18n="onTop">Сверху</span>
      <div class="seg" role="radiogroup" aria-label="Какие элементы сверху" data-i18n-aria="onTopAria">
        <input type="radio" name="stack" id="s-l" value="left"><label for="s-l" data-i18n="left">левые</label>
        <input type="radio" name="stack" id="s-r" value="right"><label for="s-r" data-i18n="right">правые</label>
      </div>
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="preset">Пресет</legend>
    <div class="pair">
      <button class="btn" id="presetSave"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg><span data-i18n="save">Сохранить</span></button>
      <button class="btn" id="presetLoad"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0L7.5 8.5M12 4l4.5 4.5M5 19h14"/></svg><span data-i18n="load">Загрузить</span></button>
    </div>
    <input type="file" id="presetFile" accept=".json,application/json" hidden>
    <p class="hint" data-i18n="presetHint">Настройки в JSON-файле. Файл можно и просто перетащить на страницу.</p>
  </fieldset>

  <div class="footer">
    <button class="btn btn-ghost" id="reset" data-i18n="reset">Сбросить настройки</button>
  </div>
</aside>

<main>
  <div class="stage"><div id="preview" role="img" aria-label="Предпросмотр обоев" data-i18n-aria="preview"></div></div>
  <div id="palette"></div>
  <div class="actions">
    <button class="btn primary" id="dlPng"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg><span data-i18n="png">Скачать PNG</span></button>
    <button class="btn" id="dlSvg"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg><span>SVG</span></button>
    <button class="btn" id="share"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg><span data-i18n="link">Ссылка</span></button>
  </div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
