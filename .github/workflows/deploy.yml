name: Deploy to Cloudflare Pages

on:
  push:
    branches: [dev]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # тег — релиз в продакшен; выкладываем, только если коммит уже в main
      - name: Check tag is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - run: bun run build

      # тег vX.Y.Z → продакшен (ветка main в Pages), dev → превью (dev.wallpaper-pills.pages.dev)
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: pages deploy dist --project-name=wallpaper-pills --branch=${{ github.ref_type == 'tag' && 'main' || github.ref_name }} --commit-dirty=true
