<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Генератор минималистичных обоев из «таблеток» — оттенки, градиенты, PNG и SVG прямо в браузере.">
<title>Pills — генератор обоев</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Crect x='4' y='8' width='12' height='16' rx='6' fill='%23e9dcff'/%3E%3Crect x='10' y='8' width='12' height='16' rx='6' fill='%239965f0'/%3E%3Crect x='16' y='8' width='12' height='16' rx='6' fill='%233b1773'/%3E%3C/svg%3E">
<style>
  :root { --bg:#0e0e11; --panel:#17171c; --field:#0e0e11; --line:#2a2a33; --text:#e8e8ee; --muted:#8b8b99; --accent:#9965f0;
          color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text);
         display:grid; grid-template-columns: 320px 1fr; height:100vh; height:100svh; }
  aside { background:var(--panel); border-right:1px solid var(--line); padding:18px; overflow-y:auto; overflow-x:hidden; }
  main { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:16px; min-width:0; }
  h1 { font-size:16px; margin:0 0 16px; letter-spacing:.02em; }
  fieldset { border:0; padding:0; margin:0 0 18px; min-width:0; }
  legend { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; padding:0; }

  .field { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:6px 0; white-space:nowrap; }
  .field .v { color:var(--muted); font-variant-numeric:tabular-nums; min-width:44px; text-align:right; }
  input[type=range] { flex:1; min-width:0; accent-color:var(--accent); }
  input[type=range]:disabled { opacity:.35; }
  input[type=number], select { background:var(--field); color:var(--text); border:1px solid var(--line);
         border-radius:6px; padding:5px 7px; font:inherit; }
  input[type=number] { width:70px; }
  input[type=checkbox] { accent-color:var(--accent); width:16px; height:16px; }
  input[type=color] { width:36px; height:28px; border:1px solid var(--line); border-radius:6px; background:none; padding:0; cursor:pointer; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .row { display:flex; gap:6px; align-items:center; }
  #preset { flex:1; min-width:0; }

  .colors { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .chip { position:relative; }
  .chip button { position:absolute; top:-6px; right:-6px; width:16px; height:16px; border-radius:50%; border:0;
         background:#444; color:#fff; font-size:10px; line-height:16px; padding:0; cursor:pointer; opacity:0; transition:opacity .15s; }
  .chip:hover button, .chip button:focus-visible { opacity:1; }
  @media (hover:none) { .chip button { opacity:1; } }

  .btn { background:#24242c; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 12px;
         font:inherit; cursor:pointer; }
  .btn:hover { border-color:var(--accent); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn:disabled { opacity:.6; cursor:progress; }
  .btn.sm { padding:4px 10px; }

  .seg { display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg input { position:absolute; opacity:0; pointer-events:none; }
  .seg label { margin:0; padding:6px 10px; cursor:pointer; flex:1; text-align:center; color:var(--muted); }
  .seg input:checked + label { background:#2a2a33; color:var(--text); }
  .seg input:focus-visible + label { outline:2px solid var(--accent); outline-offset:-2px; }

  #preview { --ar: 16/9; aspect-ratio: var(--ar); width: min(100%, calc((100svh - 150px) * (var(--ar))));
             box-shadow:0 10px 40px #0008; border-radius:6px; overflow:hidden; }
  #preview svg { display:block; width:100%; height:100%; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  #palette { display:flex; gap:4px; flex-wrap:wrap; justify-content:center; font:12px ui-monospace, monospace; }
  #palette button { font:inherit; color:var(--muted); background:none; cursor:pointer; padding:2px 6px 2px 4px;
         border-radius:4px; border:1px solid var(--line); display:flex; align-items:center; gap:5px; }
  #palette button:hover { color:var(--text); border-color:var(--accent); }
  #palette i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .hint { color:var(--muted); font-size:12px; margin:6px 0; }
  .footer { display:flex; gap:8px; }

  #toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); background:#2a2a33; color:var(--text);
           padding:8px 14px; border-radius:8px; opacity:0; pointer-events:none; transition:.2s; box-shadow:0 6px 20px #0008; }
  #toast.show { opacity:1; transform:translate(-50%, 0); }

  @media (max-width: 800px) {
    body { grid-template-columns:1fr; height:auto; }
    aside { border-right:0; border-bottom:1px solid var(--line); }
    main { order:-1; padding:16px; }
    #preview { width: min(100%, calc(60svh * (var(--ar)))); }
  }
</style>
</head>
<body>
<aside>
  <h1>Pills · генератор обоев</h1>

  <fieldset>
    <legend>Разрешение</legend>
    <div class="row">
      <select id="preset" aria-label="Пресет разрешения">
        <option value="1920x1080">1920×1080</option>
        <option value="2560x1440">2560×1440</option>
        <option value="3840x2160">3840×2160</option>
        <option value="3440x1440">3440×1440</option>
        <option value="2560x1600">2560×1600</option>
        <option value="1080x2400">1080×2400 (телефон)</option>
        <option value="1179x2556">1179×2556 (iPhone)</option>
        <option value="custom">своё…</option>
      </select>
      <input type="number" id="w" min="100" max="10000" aria-label="Ширина"> ×
      <input type="number" id="h" min="100" max="10000" aria-label="Высота">
    </div>
  </fieldset>

  <fieldset>
    <legend>Цвета</legend>
    <div class="seg" style="margin-bottom:10px" role="radiogroup" aria-label="Режим цвета">
      <input type="radio" name="mode" id="m-auto" value="auto"><label for="m-auto">Авто</label>
      <input type="radio" name="mode" id="m-grad" value="gradient"><label for="m-grad">Градиент</label>
      <input type="radio" name="mode" id="m-raw" value="raw"><label for="m-raw">Как есть</label>
    </div>
    <div class="colors" id="colors"></div>
    <p class="hint" id="modeHint"></p>
    <label class="field">Фон <input type="color" id="bg"></label>
    <label class="field">Развернуть порядок <input type="checkbox" id="reverse"></label>
    <div id="lightDark">
      <label class="field">Светлый край <input type="range" id="light" min="0.5" max="1" step="0.01"><span class="v" id="lightV"></span></label>
      <label class="field">Тёмный край <input type="range" id="dark" min="0" max="0.5" step="0.01"><span class="v" id="darkV"></span></label>
    </div>
    <button class="btn sm" id="random" title="Клавиша R">🎲 Случайные цвета</button>
  </fieldset>

  <fieldset>
    <legend>Элементы</legend>
    <label class="field">Кол-во <input type="range" id="count" min="1" max="30" step="1"><span class="v" id="countV"></span></label>
    <label class="field">Ширина ряда <input type="range" id="fit" min="0.1" max="1" step="0.01"><span class="v" id="fitV"></span></label>
    <label class="field">Высота <input type="range" id="height" min="0.05" max="1" step="0.01"><span class="v" id="heightV"></span></label>
    <label class="field">Расстояние <input type="range" id="gap" min="-0.9" max="1" step="0.01"><span class="v" id="gapV"></span></label>
    <p class="hint">Расстояние в долях ширины элемента; меньше нуля — нахлёст.</p>
    <label class="field">Скругление <input type="range" id="radius" min="0" max="1" step="0.01"><span class="v" id="radiusV"></span></label>
    <label class="field">Поворот <input type="range" id="angle" min="-90" max="90" step="1"><span class="v" id="angleV"></span></label>
    <label class="field">Тень <input type="range" id="shadow" min="0" max="1" step="0.01"><span class="v" id="shadowV"></span></label>
    <div class="field">Сверху
      <div class="seg" role="radiogroup" aria-label="Какие элементы сверху">
        <input type="radio" name="stack" id="s-l" value="left"><label for="s-l">левые</label>
        <input type="radio" name="stack" id="s-r" value="right"><label for="s-r">правые</label>
      </div>
    </div>
  </fieldset>

  <div class="footer">
    <button class="btn" id="reset">Сбросить</button>
  </div>
</aside>

<main>
  <div id="preview" role="img" aria-label="Предпросмотр обоев"></div>
  <div id="palette"></div>
  <div class="actions">
    <button class="btn primary" id="dlPng">Скачать PNG</button>
    <button class="btn" id="dlSvg">Скачать SVG</button>
    <button class="btn" id="share">Копировать ссылку</button>
  </div>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

/* ---------- цвет: hex <-> OKLab, с мягким приведением к sRGB ---------- */
const hexToRgb = h => { h = h.replace('#', ''); if (h.length === 3) h = [...h].map(c => c + c).join('');
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255); };
const rgbToHex = rgb => '#' + rgb.map(c => Math.round(clamp(c, 0, 1) * 255).toString(16).padStart(2, '0')).join('');
const lin = c => c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
const gam = c => c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055;

function toLab(hex) {
  const [r, g, b] = hexToRgb(hex).map(lin);
  const l = Math.cbrt(.4122214708*r + .5363325363*g + .0514459929*b),
        m = Math.cbrt(.2119034982*r + .6806995451*g + .1073969566*b),
        s = Math.cbrt(.0883024619*r + .2817188376*g + .6299787005*b);
  return [.2104542553*l + .7936177850*m - .0040720468*s,
          1.9779984951*l - 2.4285922050*m + .4505937099*s,
          .0259040371*l + .7827717662*m - .8086757660*s];
}
function labToLinear([L, a, b]) {
  const l = (L + .3963377774*a + .2158037573*b) ** 3,
        m = (L - .1055613458*a - .0638541728*b) ** 3,
        s = (L - .0894841775*a - 1.2914855480*b) ** 3;
  return [ 4.0767416621*l - 3.3077115913*m + .2309699292*s,
          -1.2684380046*l + 2.6097574011*m - .3413193965*s,
          -.0041960863*l - .7034186147*m + 1.7076147010*s];
}
const inGamut = rgb => rgb.every(c => c >= -1e-4 && c <= 1 + 1e-4);
// Цвета вне sRGB не обрезаем по каналам (это сдвигает оттенок), а уменьшаем хрому при том же L и hue.
function fromLab([L, a, b]) {
  L = clamp(L, 0, 1);
  let rgb = labToLinear([L, a, b]);
  if (!inGamut(rgb)) {
    const h = Math.atan2(b, a); let lo = 0, hi = Math.hypot(a, b);
    for (let i = 0; i < 24; i++) { const c = (lo + hi) / 2;
      inGamut(labToLinear([L, c * Math.cos(h), c * Math.sin(h)])) ? lo = c : hi = c; }
    rgb = labToLinear([L, lo * Math.cos(h), lo * Math.sin(h)]);
  }
  return rgbToHex(rgb.map(c => gam(clamp(c, 0, 1))));
}
const fromLch = (L, C, h) => fromLab([L, C * Math.cos(h), C * Math.sin(h)]);

function gradient(stops, n) {
  const labs = stops.map(toLab);
  if (labs.length === 1 || n === 1) return Array(n).fill(fromLab(labs[0]));
  return Array.from({ length: n }, (_, i) => {
    const pos = i / (n - 1) * (labs.length - 1), k = Math.min(Math.floor(pos), labs.length - 2), t = pos - k;
    return fromLab(labs[k].map((v, j) => v + (labs[k + 1][j] - v) * t));
  });
}
function shades(base, n, light, dark) {
  const [L0, a0, b0] = toLab(base), C0 = Math.hypot(a0, b0), hue = Math.atan2(b0, a0);
  return Array.from({ length: n }, (_, i) => {
    const t = n > 1 ? i / (n - 1) : .5, L = light + (dark - light) * t;
    // хрома максимальна возле исходной светлоты и плавно падает к краям
    const dist = Math.abs(L - L0) / Math.max(L0 - dark, light - L0, 1e-6);
    return fromLch(L, C0 * Math.max(.25, 1 - dist * dist * .75), hue);
  });
}

/* ---------- состояние ---------- */
const DEFAULTS = Object.freeze({ w:1920, h:1080, mode:'auto', colors:['#7b3fd0'], bg:'#000000', reverse:false, light:.95, dark:.2,
  count:8, fit:.69, height:.56, gap:-.3, radius:1, angle:0, shadow:0, stack:'left' });
const ENUMS = { mode: ['auto', 'gradient', 'raw'], stack: ['left', 'right'] };
const HEX = /^#?([0-9a-f]{6}|[0-9a-f]{3})$/i;
const normHex = c => { c = c.replace('#', '').toLowerCase(); if (c.length === 3) c = [...c].map(x => x + x).join(''); return '#' + c; };
const $ = id => document.getElementById(id);
const fresh = () => ({ ...DEFAULTS, colors: [...DEFAULTS.colors] });

function loadState() {
  const s = fresh();
  let q; try { q = new URLSearchParams(location.hash.slice(1)); } catch { return s; }
  for (const [k, v] of q) {
    if (k === 'colors') { const cs = v.split(',').filter(c => HEX.test(c)).map(normHex); if (cs.length) s.colors = cs.slice(0, 30); }
    else if (k === 'bg') { if (HEX.test(v)) s.bg = normHex(v); }
    else if (k === 'reverse') s.reverse = v === '1';
    else if (k in ENUMS) { if (ENUMS[k].includes(v)) s[k] = v; }
    else if (typeof DEFAULTS[k] === 'number') {
      const n = parseFloat(v), el = $(k);
      if (Number.isFinite(n)) s[k] = el ? clamp(n, +el.min, +el.max) : n;
    }
  }
  if (s.mode !== 'auto' && s.colors.length < 2) s.colors.push('#1f0044');
  return s;
}
const stateHash = () => new URLSearchParams({ ...S, colors: S.colors.map(c => c.slice(1)).join(','),
  bg: S.bg.slice(1), reverse: S.reverse ? 1 : 0 }).toString();

let S = loadState();

/* ---------- геометрия ---------- */
function build() {
  let colors;
  if (S.mode === 'raw') colors = [...S.colors];
  else if (S.mode === 'auto') colors = shades(S.colors[0], S.count, S.light, S.dark);
  else colors = gradient(S.colors, S.count);
  if (S.reverse) colors.reverse();
  const n = colors.length, W = S.w, H = S.h;
  // ширина ряда = pw + (pw + gap·pw)·(n−1) = fit·W
  const pw = S.fit * W / (1 + (1 + S.gap) * (n - 1));
  const ph = S.height * H, gap = S.gap * pw, r = Math.min(pw, ph) / 2 * S.radius;
  const total = pw + (pw + gap) * (n - 1), x0 = (W - total) / 2, y0 = (H - ph) / 2;
  let rects = colors.map((c, i) => ({ x: x0 + i * (pw + gap), y: y0, c }));
  if (S.stack === 'left') rects = rects.reverse(); // рисуются последними → оказываются сверху
  const blur = S.shadow * Math.min(pw, ph) * .12;
  return { W, H, pw, ph, r, rects, colors, blur, alpha: .25 + S.shadow * .45 };
}

function toSvg(g) {
  const f = v => +v.toFixed(2);
  const shadow = g.blur > 0
    ? `<defs><filter id="sh" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="${f(g.blur)}" flood-color="#000" flood-opacity="${f(g.alpha)}"/></filter></defs>`
    : '';
  const attrs = [g.blur > 0 && 'filter="url(#sh)"', S.angle && `transform="rotate(${S.angle} ${f(g.W / 2)} ${f(g.H / 2)})"`].filter(Boolean).join(' ');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${g.W}" height="${g.H}" viewBox="0 0 ${g.W} ${g.H}">` + shadow +
    `<rect width="100%" height="100%" fill="${S.bg}"/><g ${attrs}>` +
    g.rects.map(p => `<rect x="${f(p.x)}" y="${f(p.y)}" width="${f(g.pw)}" height="${f(g.ph)}" rx="${f(g.r)}" fill="${p.c}"/>`).join('') +
    `</g></svg>`;
}

function toCanvas(g) {
  const cv = document.createElement('canvas'); cv.width = g.W; cv.height = g.H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = S.bg; ctx.fillRect(0, 0, g.W, g.H);
  ctx.translate(g.W / 2, g.H / 2); ctx.rotate(S.angle * Math.PI / 180); ctx.translate(-g.W / 2, -g.H / 2);
  if (g.blur > 0) { ctx.shadowColor = `rgba(0,0,0,${g.alpha})`; ctx.shadowBlur = g.blur * 2; }
  for (const p of g.rects) { ctx.fillStyle = p.c; ctx.beginPath(); ctx.roundRect(p.x, p.y, g.pw, g.ph, g.r); ctx.fill(); }
  return cv;
}

/* ---------- случайные палитры ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
function randomize() {
  const h = rnd(0, Math.PI * 2);
  if (S.mode === 'auto') { S.colors = [fromLch(rnd(.5, .7), rnd(.1, .2), h)]; return; }
  const step = rnd(.6, 2) * (Math.random() < .5 ? -1 : 1), C = rnd(.08, .18);
  const stops = [fromLch(rnd(.85, .95), C * .7, h), fromLch(rnd(.6, .7), C, h + step), fromLch(rnd(.25, .35), C * .8, h + 2 * step)];
  S.colors = S.mode === 'raw' ? gradient(stops, S.colors.length >= 3 ? S.colors.length : S.count) : stops;
}

/* ---------- UI ---------- */
const pct = v => Math.round(v * 100) + '%';
const sliders = { count: v => v, fit: pct, height: pct, gap: pct, radius: pct, shadow: pct,
                  angle: v => v + '°', light: v => v.toFixed(2), dark: v => v.toFixed(2) };

let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1600); }

async function copy(text, msg = 'Скопировано') {
  try {
    if (navigator.clipboard && isSecureContext) await navigator.clipboard.writeText(text);
    else { const ta = Object.assign(document.createElement('textarea'), { value: text });
      document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    toast(msg + ' ✓');
  } catch { toast('Не удалось скопировать'); }
}

function renderColors() {
  const box = $('colors'); box.replaceChildren();
  const shown = S.mode === 'auto' ? S.colors.slice(0, 1) : S.colors;
  shown.forEach((c, i) => {
    const chip = document.createElement('div'); chip.className = 'chip';
    const inp = Object.assign(document.createElement('input'), { type: 'color', value: c, title: c });
    inp.setAttribute('aria-label', `Цвет ${i + 1}`);
    inp.oninput = () => { S.colors[i] = inp.value; inp.title = inp.value; update(false); };
    chip.append(inp);
    if (shown.length > (S.mode === 'gradient' ? 2 : 1)) {
      const x = Object.assign(document.createElement('button'), { textContent: '×', title: 'Удалить' });
      x.onclick = () => { S.colors.splice(i, 1); update(); }; chip.append(x);
    }
    box.append(chip);
  });
  if (S.mode !== 'auto' && S.colors.length < 30) {
    const add = Object.assign(document.createElement('button'), { className: 'btn sm', textContent: '+', title: 'Добавить цвет' });
    add.onclick = () => { S.colors.push(S.colors.at(-1)); update(); }; box.append(add);
  }
  $('modeHint').textContent = { auto: 'Один цвет → шкала оттенков от светлого к тёмному.',
    gradient: 'Плавный переход через все цвета, кол-во задаётся ниже.', raw: 'Каждый цвет — один элемент, без интерполяции.' }[S.mode];
  $('lightDark').hidden = S.mode !== 'auto';
  $('count').disabled = S.mode === 'raw';
}

function syncInputs() {
  $('w').value = S.w; $('h').value = S.h;
  const p = `${S.w}x${S.h}`; $('preset').value = [...$('preset').options].some(o => o.value === p) ? p : 'custom';
  document.querySelector(`input[name=mode][value=${S.mode}]`).checked = true;
  document.querySelector(`input[name=stack][value=${S.stack}]`).checked = true;
  $('bg').value = S.bg; $('reverse').checked = S.reverse;
  for (const k in sliders) $(k).value = S[k];
}

let raf;
function update(rebuildColors = true) {
  if (rebuildColors) renderColors();
  for (const k in sliders) $(k + 'V').textContent = sliders[k](S[k]);
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => {
    const g = build();
    $('preview').innerHTML = toSvg(g);
    $('preview').style.setProperty('--ar', `${g.W}/${g.H}`);
    $('palette').replaceChildren(...g.colors.map(c => {
      const b = document.createElement('button'); b.title = 'Копировать'; b.dataset.c = c;
      b.innerHTML = `<i style="background:${c}"></i>${c}`; return b;
    }));
    history.replaceState(null, '', '#' + stateHash());
  });
}

/* ---------- события ---------- */
for (const k in sliders) $(k).addEventListener('input', e => { S[k] = +e.target.value; update(false); });
$('preset').onchange = e => { if (e.target.value !== 'custom') { [S.w, S.h] = e.target.value.split('x').map(Number); syncInputs(); update(false); } };
for (const k of ['w', 'h']) $(k).addEventListener('change', e => {
  S[k] = Math.round(clamp(+e.target.value || DEFAULTS[k], 100, 10000)); syncInputs(); update(false); });
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => {
  S.mode = r.value; if (S.mode !== 'auto' && S.colors.length < 2) S.colors.push('#1f0044'); update(); });
document.querySelectorAll('input[name=stack]').forEach(r => r.onchange = () => { S.stack = r.value; update(false); });
$('bg').oninput = e => { S.bg = e.target.value; update(false); };
$('reverse').onchange = e => { S.reverse = e.target.checked; update(false); };
$('random').onclick = () => { randomize(); update(); };
$('reset').onclick = () => { S = fresh(); syncInputs(); update(); };
$('palette').onclick = e => { const b = e.target.closest('button'); if (b) copy(b.dataset.c, b.dataset.c); };
$('share').onclick = () => copy(location.href, 'Ссылка скопирована');
addEventListener('hashchange', () => { S = loadState(); syncInputs(); update(); });
addEventListener('keydown', e => {
  if (e.key.toLowerCase() !== 'r' && e.key.toLowerCase() !== 'к') return;
  if (e.ctrlKey || e.metaKey || e.altKey || e.target.matches('input[type=number], select')) return;
  randomize(); update();
});

function download(blob, name) {
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name }); a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const fname = ext => `pills-${S.w}x${S.h}.${ext}`;
$('dlSvg').onclick = () => download(new Blob([toSvg(build())], { type: 'image/svg+xml' }), fname('svg'));
$('dlPng').onclick = () => {
  const btn = $('dlPng'); btn.disabled = true; btn.textContent = 'Готовлю…';
  setTimeout(() => toCanvas(build()).toBlob(b => {
    btn.disabled = false; btn.textContent = 'Скачать PNG';
    b ? download(b, fname('png')) : toast('Браузер не смог создать PNG такого размера — попробуй SVG');
  }, 'image/png'), 20);
};

/* разрешение текущего экрана как пресет */
{
  const dpr = devicePixelRatio || 1, sw = Math.round(screen.width * dpr), sh = Math.round(screen.height * dpr);
  if (sw >= 100 && sh >= 100 && ![...$('preset').options].some(o => o.value === `${sw}x${sh}`))
    $('preset').prepend(new Option(`${sw}×${sh} (мой экран)`, `${sw}x${sh}`));
}

syncInputs(); update();
</script>
</body>
